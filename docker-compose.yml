services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    command: python -m app.worker.run
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
