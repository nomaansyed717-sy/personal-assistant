name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check app tests
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir /tmp/web  # bundles every screen

  docker:
    # The server image Render deploys. Building it here catches missing system libraries before a deploy fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aide-server .
      - name: Server starts and answers /health
        run: |
          docker run -d --name aide -p 8000:8000 \
            -e MASTER_KEY=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())") \
            -e DATABASE_URL=sqlite:////tmp/aide.db aide-server
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs aide; exit 1
